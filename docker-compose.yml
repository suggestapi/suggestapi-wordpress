services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MARIADB_USER: ${WORDPRESS_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-localdev}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${MARIADB_ROOT_PASSWORD:-localdev}"]
      interval: 5s
      timeout: 3s
      retries: 20

  wordpress:
    build: .
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
    volumes:
      - wp:/var/www/html
      - ./:/var/www/html/wp-content/plugins/suggestapi
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/wp-includes/version.php"]
      interval: 10s
      timeout: 5s
      retries: 20

  # One-shot WP-CLI: `docker compose run --rm wpcli <wp command>`
  wpcli:
    image: wordpress:cli-php8.2
    user: "33:33"
    working_dir: /var/www/html
    environment:
      WORDPRESS_DB_HOST: db
      SUGGESTAPI_PUBLIC_KEY: ${SUGGESTAPI_PUBLIC_KEY:?set SUGGESTAPI_PUBLIC_KEY}
      SUGGESTAPI_INDEX: ${SUGGESTAPI_INDEX:-ecommerce}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
    volumes:
      - wp:/var/www/html
      - ./:/var/www/html/wp-content/plugins/suggestapi
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    entrypoint: ["wp", "--allow-root"]

  # Self-contained checks: php lint + node check + live SuggestAPI + WP REST.
  # WP REST checks run against http://wordpress from inside the network.
  # `make test` runs setup first; `docker compose run --rm tests` runs the suite.
  tests:
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      API_BASE: ${SUGGESTAPI_API_BASE:-https://api.suggestapi.com}
      SUGGESTAPI_PUBLIC_KEY: ${SUGGESTAPI_PUBLIC_KEY:?set SUGGESTAPI_PUBLIC_KEY}
      SUGGESTAPI_INDEX: ${SUGGESTAPI_INDEX:-ecommerce}
      SUGGESTAPI_AGENT_URL: ${SUGGESTAPI_AGENT_URL:-https://agent.suggestapi.com}
      WP_BASE: http://wordpress
      WP_URL: ${WP_URL:-http://localhost:8080}
    depends_on:
      wordpress:
        condition: service_healthy

volumes:
  db:
  wp:
